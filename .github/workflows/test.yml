
name: test

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  golangci:
    name: lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: '1.27.x'
      - uses: golangci/golangci-lint-action@v9
        with:
          version: v2.15.0
          args: --timeout=5m

  test:
    strategy:
      matrix:
        go-version:
          - '1.18.x'
          - '1.19.x'
          - '1.20.x'
          - '1.21.x'
          - '1.22.x'
          - '1.23.x'
          - '1.24.x'
          - '1.25.x'
          - '1.26.x'
          - '1.27.x'
        os: [windows-latest, ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: ${{ matrix.go-version }}
      - run: make test

  test-cov:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: '1.27.x'
      - run: make test_cov_out
      - uses: codecov/codecov-action@v7
        with:
          files: ./coverage.txt
          use_oidc: true
          fail_ci_if_error: true
